  <rect x="336" y="130" width="140" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="348" y="150" fill="#94a3b8" font-size="12">Sort ▾</text>

  <rect x="488" y="130" width="140" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="500" y="150" fill="#94a3b8" font-size="12">Status ▾</text>

  <rect x="1076" y="130" width="120" height="30" rx="8" fill="#2563eb"/>
