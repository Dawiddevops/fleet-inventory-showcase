  <text x="466" y="230" fill="#94a3b8" font-size="10">TAG</text>
  <rect x="466" y="236" width="330" height="26" rx="6" fill="#0f172a" stroke="#2563eb"/>
  <text x="476" y="253" fill="#e2e8f0" font-size="12">[sample device]</text>
  <text x="820" y="230" fill="#94a3b8" font-size="10">EQUIPMENT TYPE</text>
  <rect x="820" y="236" width="330" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="830" y="253" fill="#e2e8f0" font-size="12">Tablet</text>

  <text x="466" y="282" fill="#94a3b8" font-size="10">MODEL</text>
  <rect x="466" y="288" width="330" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="476" y="305" fill="#e2e8f0" font-size="12">Tablet model A</text>
  <text x="820" y="282" fill="#94a3b8" font-size="10">SERIAL NUMBER (SN)</text>
  <rect x="820" y="288" width="330" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="830" y="305" fill="#e2e8f0" font-size="12">[fabricated serial]</text>

  <text x="466" y="334" fill="#94a3b8" font-size="10">UNIQUE NUMBER / IMEI</text>
  <rect x="466" y="340" width="330" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="476" y="357" fill="#e2e8f0" font-size="12">[fabricated device ID]</text>
  <text x="820" y="334" fill="#94a3b8" font-size="10">SIM / PHONE</text>
  <rect x="820" y="340" width="330" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="830" y="357" fill="#e2e8f0" font-size="12">[fabricated phone]</text>

  <text x="466" y="386" fill="#94a3b8" font-size="10">CARRIER</text>
  <rect x="466" y="392" width="330" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="476" y="409" fill="#e2e8f0" font-size="12">Carrier A</text>
  <text x="820" y="386" fill="#94a3b8" font-size="10">EQUIPMENT STATUS</text>
  <rect x="820" y="392" width="330" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="830" y="409" fill="#e2e8f0" font-size="12">Assigned</text>

  <text x="466" y="438" fill="#94a3b8" font-size="10">NOTES</text>
  <rect x="466" y="444" width="684" height="60" rx="6" fill="#0f172a" stroke="#334155"/>

  <rect x="466" y="530" width="150" height="34" rx="8" fill="#2563eb"/>
  <text x="490" y="552" fill="#ffffff" font-size="12" font-weight="600">Save changes</text>

  <rect x="1046" y="530" width="150" height="34" rx="8" fill="#dc2626"/>
  <text x="1086" y="552" fill="#ffffff" font-size="12" font-weight="600">Delete</text>

  <text x="466" y="600" fill="#475569" font-size="10">Reconstructed interface preview — fabricated data</text>
