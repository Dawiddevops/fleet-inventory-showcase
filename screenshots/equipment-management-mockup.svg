  <text x="40" y="218" fill="#94a3b8" font-size="11">Tablet model A · Carrier A</text>
  <line x1="24" y1="242" x2="424" y2="242" stroke="#334155"/>

  <text x="40" y="266" fill="#e2e8f0" font-size="13" font-weight="700">[sample device]</text>
  <text x="330" y="266" fill="#fbbf24" font-size="11" font-weight="700">Under review</text>
  <text x="40" y="284" fill="#94a3b8" font-size="11">Printer model A · Carrier A</text>
  <line x1="24" y1="308" x2="424" y2="308" stroke="#334155"/>

  <text x="40" y="332" fill="#e2e8f0" font-size="13" font-weight="700">[sample device]</text>
  <text x="340" y="332" fill="#4ade80" font-size="11" font-weight="700">Assigned</text>
  <text x="40" y="350" fill="#94a3b8" font-size="11">Tablet model A · Carrier B</text>
  <line x1="24" y1="374" x2="424" y2="374" stroke="#334155"/>

  <text x="40" y="398" fill="#e2e8f0" font-size="13" font-weight="700">[sample device]</text>
  <text x="320" y="398" fill="#f87171" font-size="11" font-weight="700">Unavailable</text>
  <text x="40" y="416" fill="#94a3b8" font-size="11">Printer model A · Carrier B</text>
  <line x1="24" y1="440" x2="424" y2="440" stroke="#334155"/>

  <text x="40" y="464" fill="#e2e8f0" font-size="13" font-weight="700">[sample device]</text>
  <text x="330" y="464" fill="#94a3b8" font-size="11" font-weight="700">Available</text>
  <text x="40" y="482" fill="#94a3b8" font-size="11">Tablet model B · Warehouse</text>

  <text x="40" y="516" fill="#64748b" font-size="11">Additional inventory records</text>

  <!-- edit card -->
  <rect x="444" y="176" width="752" height="480" rx="10" fill="#1e293b" stroke="#334155"/>
