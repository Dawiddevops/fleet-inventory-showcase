  <text x="24" y="112" fill="#94a3b8" font-size="13">Select an item from the list, review and correct its data (tag, serial number, unique number/IMEI, and other fields)</text>

  <rect x="24" y="130" width="300" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
